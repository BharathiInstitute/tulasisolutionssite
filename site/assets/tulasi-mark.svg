<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-labelledby="title desc">
  <defs>
    <linearGradient id="markLeafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24A64A" />
      <stop offset="100%" stop-color="#82C51F" />
    </linearGradient>
    <linearGradient id="markCloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#82C51F" />
      <stop offset="100%" stop-color="#24A64A" />
    </linearGradient>
  </defs>
  
  <rect width="520" height="220" rx="36" fill="#FFFFFF"/>
  <g>
    <!-- Cloud shape on the left framing TULASI -->
    <path d="M 64,152 C 28,152 12,132 12,102 C 12,78 30,58 54,58 C 58,58 64,60 68,62 C 78,34 104,18 132,18 C 164,18 188,38 196,68 C 204,64 214,62 224,62 C 256,62 278,86 278,114 C 278,126 274,138 266,146" 
          fill="none" 
