          fill="none" 
          stroke="#24A64A" 
          stroke-width="12" 
          stroke-linecap="round" />

    <!-- White leaf veins (pure vectors matching the original logo detail) -->
    <path d="M 312,48 C 352,24 398,22 432,32 C 454,39 474,58 480,82 C 454,64 420,54 384,54" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="6" 
          stroke-linecap="round" />
    <path d="M 358,54 C 392,34 428,38 450,54 L 416,54" 
          fill="none" 
          stroke="url(#markLeafGrad)" 
          stroke-width="4" 
          stroke-linecap="round" />
  </g>
</svg>
