          stroke-linecap="round" />
    <path d="M 64,152 L 180,152" 
          fill="none" 
          stroke="url(#markCloudGrad)" 
          stroke-width="12" 
          stroke-linecap="round" />

    <!-- Highly refined curved Leaf on the right arching over to the left -->
    <!-- Solid leaf body with green-to-lime gradient -->
    <path d="M 270,140 C 270,82 322,34 394,22 C 452,10 496,44 496,102 C 496,124 490,144 480,160 C 484,115 464,74 426,52 C 378,26 314,24 246,44 Z" 
          fill="url(#markLeafGrad)" />
          
    <!-- Main leaf branch / stem curving down -->
